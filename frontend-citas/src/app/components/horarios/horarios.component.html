<section class="horarios">
  <h2>Horarios disponibles</h2>

  <div *ngIf="cargando" class="estado">
    Cargando horarios...
  </div>

  <div *ngIf="error" class="error" role="alert">
    {{ error }}
  </div>

  <table *ngIf="!cargando && !error && disponibilidades.length > 0">
    <thead>
      <tr>
        <th>Asesor</th>
        <th>Fecha</th>
        <th>Hora inicio</th>
        <th>Hora fin</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of disponibilidades">
        <td>{{ d.asesor }}</td>
        <td>{{ d.fecha }}</td>
        <td>{{ d.horaInicio }}</td>
        <td>{{ d.horaFin }}</td>
        <td>{{ d.estado }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!cargando && !error && disponibilidades.length === 0" class="estado">
    No hay horarios disponibles por ahora.
  </div>

  <button (click)="cargarDisponibilidades()">Recargar</button>
</section>
