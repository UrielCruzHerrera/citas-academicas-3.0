# ===== Aplicación =====
spring.application.name=backend-citas
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=${CITAS_DB_URL:jdbc:postgresql://localhost:5432/citas_academicas}
spring.datasource.username=${CITAS_DB_USER:postgres}
spring.datasource.password=${CITAS_DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Errores =====
server.error.include-message=always
server.error.include-binding-errors=always